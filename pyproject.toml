[project]
name = "sweetie"
version = "0.1.0"
description = "A small, sim-only tele-op platform for a Unitree Go2 with hybrid (FSM + LLM) control."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.7",
    "websockets>=12.0",
    "anthropic>=0.39",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]
# Optional: only needed when SWEETIE_BRIDGE=real. Pulls in the upstream
# Unitree SDK. If pip can't find unitree_sdk2py on PyPI in your region,
# install from GitHub directly:
#   pip install git+https://github.com/unitreerobotics/unitree_sdk2_python
real = [
    "unitree_sdk2py",
]

[project.scripts]
sweetie = "sweetie.main:run"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["sweetie*"]
